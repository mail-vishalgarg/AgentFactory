apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentfactory-backend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
      - image: $BACKEND_IMAGE
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: GEMINI_API_KEY
          value: $GEMINI_API_KEY
        - name: GEMINI_MODEL
          value: $GEMINI_MODEL
        - name: OPENAI_API_KEY
          value: $OPENAI_API_KEY
        - name: OPENAI_MODEL
          value: $OPENAI_MODEL
        - name: DATABASE_URL
          value: $DATABASE_URL
        - name: SUPABASE_URL
          value: $SUPABASE_URL
        - name: SUPABASE_ANON_KEY
          value: $SUPABASE_ANON_KEY
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: $SUPABASE_SERVICE_ROLE_KEY
        - name: JWT_SECRET
          value: $JWT_SECRET
        - name: JWT_EXPIRE_MINUTES
          value: "60"
        - name: FRONTEND_ORIGIN
          value: $FRONTEND_ORIGIN
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          timeoutSeconds: 3
          periodSeconds: 30
          failureThreshold: 3
